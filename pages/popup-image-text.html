<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 + 텍스트 - OBS 브라우저 소스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        .image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .text {
            font-weight: bold;
            word-wrap: break-word;
            max-width: 300px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .draggable {
            position: absolute;
            cursor: move;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="content draggable" id="content">
        <img id="image" class="image" src="" alt="이미지">
        <div id="text" class="text"></div>
    </div>

    <script>
        // URL 파라미터에서 설정값 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const showImage = urlParams.get('showImage') !== 'false';
        const showText = urlParams.get('showText') !== 'false';
        const imageUrl = urlParams.get('image') || 'https://jjap.shop/assets/images/obs.webp';
        const text = urlParams.get('text') || '방송 준비중~';
        const size = urlParams.get('size') || '24';
        const color = urlParams.get('color') || '#ffffff';
        const fontFamily = urlParams.get('fontFamily') || 'Arial, sans-serif';
        const fontWeight = urlParams.get('fontWeight') || 'bold';
        const textAlign = urlParams.get('textAlign') || 'center';
        const shadowColor = urlParams.get('shadowColor') || '#000000';
        const shadowBlur = urlParams.get('shadowBlur') || '2';
        const imageWidth = urlParams.get('imageWidth') || '150';
        const imageHeight = urlParams.get('imageHeight') || '150';

        // 이미지와 텍스트 설정
        const imageElement = document.getElementById('image');
        const textElement = document.getElementById('text');
        
        // 이미지 설정
        imageElement.style.display = showImage ? 'block' : 'none';
        imageElement.src = imageUrl;
        imageElement.style.width = imageWidth + 'px';
        imageElement.style.height = imageHeight + 'px';
        
        // 텍스트 설정
        textElement.style.display = showText ? 'block' : 'none';
        textElement.textContent = text;
        textElement.style.fontSize = size + 'px';
        textElement.style.color = color;
        textElement.style.fontFamily = fontFamily;
        textElement.style.fontWeight = fontWeight;
        textElement.style.textAlign = textAlign;
        textElement.style.textShadow = `2px 2px ${shadowBlur}px ${shadowColor}`;

        // 드래그 앤 드롭 기능
        let isDragging = false;
        let dragOffset = { x: 0, y: 0 };

        document.getElementById('content').addEventListener('mousedown', function(e) {
            isDragging = true;
            const rect = this.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            this.style.zIndex = '1000';
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                const content = document.getElementById('content');
                const x = e.clientX - dragOffset.x;
                const y = e.clientY - dragOffset.y;
                content.style.left = x + 'px';
                content.style.top = y + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                document.getElementById('content').style.zIndex = 'auto';
            }
        });

        // 초기 위치 설정
        document.getElementById('content').style.left = '50px';
        document.getElementById('content').style.top = '50px';
    </script>
</body>
</html>
